<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet"><meta name="description" content="Sanyue ImgHub - A modern file hosting platform"><meta name="keywords" content="Sanyue, ImgHub, file hosting, image hosting, cloud storage"><meta name="author" content="SanyueQi"><title>Sanyue ImgHub</title><script defer="defer" src="/js/chunk-vendors.c0852d4e.js"></script><script defer="defer" src="/js/app.34dadb84.js?v=20261013"></script><link href="/css/chunk-vendors.f9cd4701.css" rel="stylesheet"><link href="/css/app.966aac8a.css" rel="stylesheet"><link href="/css/snappy.css?v=20261013t" rel="stylesheet"></head><body><noscript><strong>We're sorry but sanyue_imghub doesn't work properly without JavaScript enabled. Please enable it to continue.</strong></noscript><div id="app"></div><script>
/* 路由标记：用户登录页与管理登录页共用同一套组件类名，用 body[data-login-page] 区分，
   登录页布局样式仅在 data-login-page="user" 时生效 */
(function(){
  function mark(){
    var p = location.pathname, t = '';
    var pl = p.toLowerCase();
    if (pl === '/adminlogin' || pl.indexOf('/adminlogin/') === 0) t = 'admin';
    else if (pl === '/login' || pl.indexOf('/login/') === 0) t = 'user';
    if (document.body.dataset.loginPage !== t) document.body.dataset.loginPage = t;
  }
  function init(){
    if (!document.body) { setTimeout(init, 50); return; }
    mark();
    var _ps = history.pushState, _rs = history.replaceState;
    history.pushState = function(){ _ps.apply(this, arguments); setTimeout(mark, 50); };
    history.replaceState = function(){ _rs.apply(this, arguments); setTimeout(mark, 50); };
    window.addEventListener('popstate', function(){ setTimeout(mark, 50); });
    setInterval(mark, 1500);
  }
  init();
})();
/* 用户登录页：左上角 logo 改链到本站首页（原链向上游 GitHub） */
(function(){var n=0;function f(){
  var a = document.querySelector('.login .logo--absolute a');
  if (a) { a.href = 'https://img.nice.us.kg/'; a.target = '_self'; return; }
  if (++n < 80) setTimeout(f, 250);
}f();})();
/* 用户登录页：补输入框占位提示（上游未配 placeholder，原靠"密码"标签提示，标签已按需求隐藏） */
(function(){var n=0;function f(){
  if (document.body.dataset.loginPage !== 'user') { if (++n < 80) setTimeout(f, 250); return; }
  var el = document.querySelector('.login .password-input input');
  if (el) { if (!el.getAttribute('placeholder')) el.setAttribute('placeholder', '请输入认证码'); return; }
  if (++n < 80) setTimeout(f, 250);
}f();})();
</script>
</body></html>
